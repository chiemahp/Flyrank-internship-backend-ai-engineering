services:
  rag-assistant:
    build: .
    ports:
      - "8501:8501"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    volumes:
      - rag_documents:/app/docs
      - rag_vectors:/app/chroma_db
    restart: unless-stopped

volumes:
  rag_documents:
  rag_vectors:
